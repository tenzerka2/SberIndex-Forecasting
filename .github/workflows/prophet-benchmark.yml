name: Prophet comparison
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/prophet-benchmark.yml'
      - 'benchmarks/contest_prophet.py'
      - 'benchmarks/prepare_contest_bundle.py'
      - 'data/benchmark/**'
      - 'config/contest_prophet.json'
      - 'requirements-prophet.txt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prophet-${{ github.ref }}
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-prophet.txt
      - run: python -m pip install -r requirements-prophet.txt
      - run: python -m unittest discover -s tests -p 'test_contest_prophet.py'
      - name: Verify actual Prophet on one municipality and all horizons
        run: python -u benchmarks/contest_prophet.py --prepared data/benchmark --sample 1 --workers 1 --output outputs/ci_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prophet-smoke
          path: outputs/ci_smoke
          retention-days: 14
  compare:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [auto, log_fourier4, log_month_dummies]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-prophet.txt
      - run: python -m pip install -r requirements-prophet.txt
      - name: Compare identical 100-series sample; preserve every fitted model prediction
        run: python -u benchmarks/contest_prophet.py --prepared data/benchmark --sample 100 --workers 2 --variants ${{ matrix.variant }} --output outputs/ci_${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prophet-${{ matrix.variant }}
          path: outputs/ci_${{ matrix.variant }}
          retention-days: 14
